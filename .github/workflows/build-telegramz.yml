name: Build TelegramZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/local-hidden-chats

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: 'platform-tools'

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if not api_id or not api_hash:
              raise SystemExit("Required GitHub Actions secrets are missing.")
          if not api_id.isdigit() or not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              raise SystemExit("Telegram API credentials have an invalid format.")

          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text(encoding="utf-8")
          source, id_count = re.subn(r"public static int APP_ID = \\d+;", f"public static int APP_ID = {api_id};", source, count=1)
          source, hash_count = re.subn(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{api_hash}";', source, count=1)
          if id_count != 1 or hash_count != 1:
              raise SystemExit("Could not safely locate the Telegram API settings in BuildVars.java.")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Build TelegramZ
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Prepare APK
        run: |
          test -f TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          cp TMessagesProj_App/build/outputs/apk/afat/debug/app.apk TelegramZ.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramZ-apk
          path: TelegramZ.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telegramz-build-${{ github.run_number }}
          name: TelegramZ build ${{ github.run_number }}
          files: TelegramZ.apk
